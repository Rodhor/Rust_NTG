<!DOCTYPE html>
<html lang="en" class="wa-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTG API Tester</title>
    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.12.0/styles/themes/default.css">
    <script type="module" src="https://ka-f.webawesome.com/webawesome@3.12.0/webawesome.loader.js"></script>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <style>
        :not(:defined) { visibility: hidden; }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        pre {
            margin: 1rem 0 0;
            padding: 0.75rem;
            overflow-x: auto;
            min-height: 2.5rem;
            font-size: 0.85rem;
        }

        wa-dialog form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .htmx-indicator {
            opacity: 0;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body>
<wa-toast-stack></wa-toast-stack>

<main>
    <h1>NTG API Tester</h1>

    <wa-card>
        <h3 slot="header">DB</h3>
        <wa-button-group>
            <wa-button hx-post="/api/v1/db/connect" hx-target="#db-result" hx-swap="innerHTML">
                Connect <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
            <wa-button hx-post="/api/v1/db/disconnect" hx-target="#db-result" hx-swap="innerHTML">
                Disconnect <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
            <wa-button hx-post="/api/v1/db/query" hx-target="#db-result" hx-swap="innerHTML">
                Run Query <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
        </wa-button-group>
        <pre id="db-result">...</pre>
    </wa-card>

    <wa-card>
        <h3 slot="header">SFTP</h3>
        <wa-button-group>
            <wa-button hx-on:click="document.querySelector('#connect-dialog').show()">
                Connect
            </wa-button>
            <wa-button hx-post="/api/v1/sftp/disconnect" hx-target="#sftp-disconnect-result" hx-swap="innerHTML">
                Disconnect <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
            <wa-button hx-get="/api/v1/sftp/list" hx-target="#sftp-list-result" hx-swap="innerHTML">
                List <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
            <wa-button hx-post="/api/v1/sftp/upload" hx-target="#sftp-upload-result" hx-swap="innerHTML">
                Upload <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
            <wa-button hx-post="/api/v1/sftp/download" hx-target="#sftp-download-result" hx-swap="innerHTML">
                Download <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
            </wa-button>
        </wa-button-group>
        <pre id="sftp-disconnect-result">...</pre>
        <pre id="sftp-list-result">...</pre>
        <pre id="sftp-upload-result">...</pre>
        <pre id="sftp-download-result">...</pre>
    </wa-card>

    <wa-dialog id="connect-dialog" label="Connect SFTP">
        <form hx-post="/api/v1/sftp/connect"
              hx-target="#sftp-connection-result"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) this.closest('wa-dialog').hide()">
            <wa-input name="host" label="Host" required></wa-input>
            <wa-input name="port" label="Port" type="number" min="1" max="65535" value="22" required></wa-input>
            <wa-input name="username" label="Username" autocomplete="username" required></wa-input>
            <wa-input name="password" label="Password" type="password" autocomplete="current-password" password-toggle required></wa-input>
            <wa-button-group>
                <wa-button type="submit" variant="brand">
                    Connect <wa-spinner class="htmx-indicator" style="font-size: 1em"></wa-spinner>
                </wa-button>
                <wa-button hx-on:click="this.closest('wa-dialog').hide()">Cancel</wa-button>
            </wa-button-group>
        </form>
    </wa-dialog>
    <pre id="sftp-connection-result">...</pre>
</main>

<script>
    function showToast(message, variant) {
        document.querySelector('wa-toast-stack').create(message, {
            variant: variant || 'neutral'
        });
    }

    document.body.addEventListener('htmx:beforeSwap', function (evt) {
        if (evt.detail.xhr.status >= 400) {
            evt.detail.shouldSwap = true;
            var message = 'Request failed';
            try {
                var data = JSON.parse(evt.detail.xhr.responseText);
                if (typeof data.error === 'string') message = data.error;
            } catch (e) {}
            showToast(message, 'danger');
        }
    });

    document.body.addEventListener('htmx:sendError', function () {
        showToast('Could not reach the server', 'danger');
    });

    document.body.addEventListener('htmx:afterSwap', function (evt) {
        var el = evt.detail.target;
        if (el.id === 'sftp-connection-result' || el.id === 'sftp-disconnect-result') {
            try {
                var data = JSON.parse(el.innerText);
                if (data.success === true) {
                    showToast('Request completed successfully', 'success');
                }
            } catch (e) {}
        }
    });
</script>

</body>
</html>
