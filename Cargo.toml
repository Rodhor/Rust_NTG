[package]
name = "rust-ntg"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "2.0"
envy = "0.4"
dotenvy = "0.15.7"
ssh2 = "0.9.6"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros", "migrate", "sqlite", "chrono", "derive"] }
